[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memwise"
version = "0.4.0"
description = "Long-term memory for AI products: decides what to keep, notices when facts stop being true, and checks whether to speak up."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pankajrohilla893" }]
keywords = ["llm", "memory", "long-term-memory", "ai", "agents", "personalization", "chatbot", "ollama", "openai-compatible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []  # no dependencies: works with any model provider

[project.urls]
Homepage = "https://github.com/pankajrohilla893/MemWise"
Documentation = "https://github.com/pankajrohilla893/MemWise/blob/main/docs/how-it-works.md"
Issues = "https://github.com/pankajrohilla893/MemWise/issues"

[tool.setuptools.packages.find]
include = ["memwise*"]

[tool.setuptools.package-data]
memwise = ["py.typed"]
